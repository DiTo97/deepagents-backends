name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "benchmark/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy benchmark dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: benchmark/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: benchmark/dashboard
        run: npm ci

      - name: Build static dashboard
        working-directory: benchmark/dashboard
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p site/results
          cp -R benchmark/web/. site/
          cp benchmark/results/latest.json site/results/latest.json
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
